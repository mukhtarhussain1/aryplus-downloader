services:
  - type: web
    name: aryplus-downloader
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./Dockerfile
    envVars:
      - key: PORT
        value: 3000
      - key: NODE_ENV
        value: production
      - key: DOWNLOAD_DIR
        value: ./downloads
      - key: MAX_DOWNLOAD_SIZE_MB
        value: 5000
      - key: MAX_CONCURRENT_DOWNLOADS
        value: 2
      - key: DOWNLOAD_TIMEOUT_MS
        value: 3600000
      - key: ALLOWED_PAGE_DOMAIN
        value: aryplus.tv
      - key: ALLOWED_MEDIA_DOMAINS
        value: vod.aryzap.com
